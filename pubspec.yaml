name: railway_hrms
description: "Pakistan Railway Operational and Management Integrated Services Ecosystem."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.2.0+23
environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.0+1
  face_kit:
    path: packages/face_kit
  path_provider: ^2.1.2
  firebase_messaging: ^16.1.1
  firebase_core: ^4.4.0
  flutter_local_notifications: ^22.0.0
  shared_preferences: ^2.5.4
  flutter_bloc: ^9.1.1
  dio: ^5.9.2
  image_picker: ^1.1.2
  image: ^4.8.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  firebase_crashlytics: ^5.1.0
  skeletonizer: ^2.1.3
  connectivity_plus: ^7.2.0
  local_auth: ^3.0.2
  maplibre_gl: ^0.27.0
  in_app_update: ^5.0.0
  permission_handler: ^13.0.2
  pdf: ^3.13.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_face_detection: ^0.15.1
  printing: ^5.15.1
  lottie: ^3.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  # The liquid glass of selections, run over the backdrop.
  shaders:
    - shaders/liquid_glass.frag
  # Strings live in lib/core/l10n/arb; `flutter gen-l10n` writes the classes.
  generate: true
  assets:
    - assets/
    - assets/forms/
    - assets/icons/3d/
    - assets/lottie/
    - assets/fonts/inter/OFL.txt
    - assets/fonts/outfit/OFL.txt
    - .env.prod
  # Inter sets the text and Outfit the headings and big numbers; the families
  # are named in lib/core/design_system/foundations/app_fonts.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
